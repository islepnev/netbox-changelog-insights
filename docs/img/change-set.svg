<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>One cable, six changelog records, one primary change</title>
  <style>
    .fg { fill: #1f2328; } .mute { fill: #59636e; } .line { stroke: #d1d9e0; } .box { fill: #f6f8fa; stroke: #d1d9e0; }
    .c { fill: #2da44e; } .u { fill: #0969da; } .badge { fill: #ffffff; font-size: 11px; font-weight: 600; }
    .hl { fill: #dafbe1; stroke: #2da44e; } .arrow { stroke: #59636e; fill: none; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #f0f6fc; } .mute { fill: #9198a1; } .line { stroke: #3d444d; } .box { fill: #151b23; stroke: #3d444d; }
      .hl { fill: #12261e; stroke: #2ea043; } .arrow { stroke: #9198a1; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="mute"/></marker></defs>

  <rect x="1" y="1" width="470" height="260" rx="6" class="box"/>
  <text x="16" y="24" class="fg" font-weight="600">Change set: one request, 6 records</text>
  <text x="16" y="42" class="mute">request_id 3f2a…, user alice: "Connect eth1 – eth1"</text>

  <rect x="10" y="54" width="452" height="30" rx="4" class="hl"/>
  <rect x="18" y="61" width="54" height="17" rx="3" class="c"/><text x="45" y="73.5" text-anchor="middle" class="badge">Created</text>
  <text x="82" y="74" class="fg" font-weight="600">Cable #3969</text><text x="452" y="74" text-anchor="end" class="fg" font-weight="600">primary</text>

  <g class="fg">
    <rect x="34" y="96" width="54" height="17" rx="3" class="u"/><text x="61" y="108.5" text-anchor="middle" class="badge">Updated</text>
    <text x="98" y="109">Cable #3969</text><text x="452" y="109" text-anchor="end" class="mute">same object</text>
    <rect x="34" y="126" width="54" height="17" rx="3" class="c"/><text x="61" y="138.5" text-anchor="middle" class="badge">Created</text>
    <text x="98" y="139">Cable termination A</text><text x="452" y="139" text-anchor="end" class="mute">termination of the cable</text>
    <rect x="34" y="156" width="54" height="17" rx="3" class="c"/><text x="61" y="168.5" text-anchor="middle" class="badge">Created</text>
    <text x="98" y="169">Cable termination B</text><text x="452" y="169" text-anchor="end" class="mute">termination of the cable</text>
    <rect x="34" y="186" width="54" height="17" rx="3" class="u"/><text x="61" y="198.5" text-anchor="middle" class="badge">Updated</text>
    <text x="98" y="199">Interface d1 eth1</text><text x="452" y="199" text-anchor="end" class="mute">cable fields only</text>
    <rect x="34" y="216" width="54" height="17" rx="3" class="u"/><text x="61" y="228.5" text-anchor="middle" class="badge">Updated</text>
    <text x="98" y="229">Interface d2 eth1</text><text x="452" y="229" text-anchor="end" class="mute">cable fields only</text>
  </g>
  <path d="M22,86 V225" class="line" stroke-width="1.5"/>
  <path d="M22,105 H30 M22,135 H30 M22,165 H30 M22,195 H30 M22,225 H30" class="line" stroke-width="1.5"/>
  <text x="16" y="252" class="mute" font-size="12">5 side effects fold into their cause</text>

  <path d="M480,131 H512" class="arrow" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="520" y="1" width="238" height="260" rx="6" class="box"/>
  <text x="536" y="24" class="fg" font-weight="600">Counted by the plugin</text>
  <text x="536" y="70" class="fg" font-size="28" font-weight="600">1</text><text x="566" y="70" class="mute">change set</text>
  <text x="536" y="114" class="fg" font-size="28" font-weight="600">1</text><text x="566" y="114" class="mute">primary change</text>
  <text x="536" y="158" class="mute" font-size="28" font-weight="600">5</text><text x="566" y="158" class="mute">folded, shown on click</text>
  <path d="M536,180 H742" class="line"/>
  <text x="536" y="204" class="mute">The core changelog shows</text>
  <text x="536" y="222" class="mute">6 records: cabling work would</text>
  <text x="536" y="240" class="mute">outrank everything else.</text>
</svg>
