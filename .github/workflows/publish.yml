name: publish

# Publish to PyPI when a version tag (v1.2.3) is pushed. PyPI Trusted Publishing: no token.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that the tag and the package version agree
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init=$(sed -n "s/^__version__ = '\(.*\)'/\1/p" netbox_changelog_insights/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" -a "$version" = "$init" || {
            echo "Tag $GITHUB_REF_NAME, pyproject.toml $version, __init__.py $init"; exit 1; }
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
