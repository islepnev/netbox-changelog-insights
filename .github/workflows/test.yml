name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        netbox: ['v4.6.4', 'v4.6.10', 'v4.7.4']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox }}
          path: netbox
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: netbox/requirements.txt
      - name: Install NetBox and the plugin
        run: |
          sed 's/psycopg\[c,pool\]/psycopg[binary,pool]/' netbox/requirements.txt > requirements.txt
          pip install -r requirements.txt
          pip install -e plugin
      - name: Configure NetBox
        run: |
          cat > netbox/netbox/netbox/configuration.py <<'EOF'
          ALLOWED_HOSTS = ['*']
          DATABASES = {'default': {'ENGINE': 'django.db.backends.postgresql', 'NAME': 'netbox', 'USER': 'netbox',
                                   'PASSWORD': 'netbox', 'HOST': 'localhost', 'PORT': '5432'}}
          REDIS = {'tasks': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 0, 'SSL': False},
                   'caching': {'HOST': 'localhost', 'PORT': 6379, 'DATABASE': 1, 'SSL': False}}
          SECRET_KEY = 'ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ'
          API_TOKEN_PEPPERS = {1: 'ci-pepper-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ'}
          TIME_ZONE = 'UTC'
          PLUGINS = ['netbox_changelog_insights']
          PLUGINS_CONFIG = {'netbox_changelog_insights': {'automation_group': 'automation'}}
          CHANGELOG_RETENTION = 0
          EOF
      - name: Test
        working-directory: netbox/netbox
        run: python manage.py test netbox_changelog_insights --parallel 1 -v 2
