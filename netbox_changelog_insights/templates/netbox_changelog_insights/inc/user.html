{% load i18n %}<a href="{{ u.filter_url }}" title="{% trans 'Filter by this user' %}"{% if u.deleted %} class="text-secondary"{% endif %}>{{ u.user_name }}</a>{% if u.deleted %} <span class="badge text-bg-secondary" title="{% trans 'The user account is deleted' %}">{% trans "deleted" %}</span>{% endif %}{% if u.kind == 'automation' %} <i class="mdi mdi-robot-outline text-secondary" title="{% trans 'Automation' %}"></i>{% endif %}
